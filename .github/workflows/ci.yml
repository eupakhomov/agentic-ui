name: CI

# Minimal safety net (docs/plan/phase-9-production-hardening.md T7): compile the backend
# and run its DB-less unit tests, typecheck both sidecars and guard their synced protocol
# files (T5), and typecheck+build the frontend. No Postgres service here on purpose —
# ApplicationTests (@SpringBootTest, needs a live DB) is tagged "integration" and stays
# out of this run; it's still the manual-test-script's job locally. Everything after this
# workflow lands on green CI.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (compile + DB-less unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Skips the frontend-maven-plugin's npm install/build (irrelevant to a backend
      # compile+test check, and slow) — same flags CLAUDE.md documents for a fast local
      # build. -DexcludedGroups=integration drops ApplicationTests (needs live Postgres).
      - name: Compile and run unit tests
        run: ./mvnw -B -Dskip.installnodenpm -Dskip.npm -DexcludedGroups=integration test

  sidecars:
    name: Sidecars (typecheck + protocol-sync guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Pure Node, no deps — runs before the (slower) npm installs so a real drift fails fast.
      - name: Check sidecar/sidecar-codex protocol files are in sync
        run: node scripts/check-protocol-sync.mjs
      - name: Typecheck sidecar
        working-directory: sidecar
        run: |
          npm ci
          npm run build
      - name: Typecheck sidecar-codex
        working-directory: sidecar-codex
        run: |
          npm ci
          npm run build

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run build
