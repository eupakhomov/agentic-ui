spring:
  application:
    name: claude.ui
  datasource:
    url: jdbc:postgresql://localhost:5432/claude_ui
    username: claude_ui
    password: ${CLAUDE_UI_DB_PASSWORD:claude_ui}

server:
  address: 127.0.0.1   # LAN use: set a real address AND claude-ui.auth-token (enforced at startup)
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-components: always

claude-ui:
  repo-path: ${CLAUDE_UI_REPO:/mnt/d/projects/claude-ui}
  worktree-root: ${CLAUDE_UI_WORKTREE_ROOT:${HOME}/claude-worktrees}
  ecosystem-root: ${CLAUDE_UI_ECOSYSTEM_ROOT:/mnt/d/projects}
  skills-root: ${CLAUDE_UI_SKILLS_ROOT:${HOME}/claude-skills}
  max-sessions: ${CLAUDE_UI_MAX_SESSIONS:4}
  idle-park-minutes: ${CLAUDE_UI_IDLE_PARK_MINUTES:30}
  log-dir: ${CLAUDE_UI_LOG_DIR:logs}
  journal-payload-cap-bytes: ${CLAUDE_UI_JOURNAL_PAYLOAD_CAP:65536}
  ws-send-buffer-bytes: ${CLAUDE_UI_WS_BUFFER_LIMIT:1048576}
  auth-token: ${CLAUDE_UI_TOKEN:}
  linear-api-key: ${CLAUDE_UI_LINEAR_API_KEY:}
  providers:
    claude:
      command: ["node", "sidecar/dist/index.js"]
