spring:
  application:
    name: agentic.ui
  datasource:
    url: jdbc:postgresql://localhost:5432/artus
    username: artus
    password: ${ARTUS_DB_PASSWORD:artus}
  ai:
    mcp:
      server:
        name: artus-memory
        version: 1.0.0
        protocol: STREAMABLE
        # mounted under /api/** so the existing bearer-token AuthTokenFilter gates it —
        # see docs/plan/phase-5.3-memory-reflection.md decision 12a
        streamable-http:
          mcp-endpoint: /api/mcp/memory

server:
  address: 127.0.0.1   # LAN use: set a real address; with the token off, artus.auth.trusted-cidrs decides who may connect
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-components: always

# Env vars are ARTUS_* only (the app was agentic-ui until 2026-10, claude-ui before that;
# no fallbacks to the old names). The default data dirs below keep their pre-rename names
# so existing worktrees/skills/memory stay where they are.
artus:
  repo-path: ${ARTUS_REPO:/mnt/d/projects/artus}
  worktree-root: ${ARTUS_WORKTREE_ROOT:${HOME}/agentic-worktrees}
  skills-root: ${ARTUS_SKILLS_ROOT:${HOME}/agentic-skills}
  memory-root: ${ARTUS_MEMORY_ROOT:${HOME}/agentic-memory}
  max-sessions: ${ARTUS_MAX_SESSIONS:4}
  idle-park-minutes: ${ARTUS_IDLE_PARK_MINUTES:30}
  log-dir: ${ARTUS_LOG_DIR:logs}
  journal-payload-cap-bytes: ${ARTUS_JOURNAL_PAYLOAD_CAP:65536}
  ws-send-buffer-bytes: ${ARTUS_WS_BUFFER_LIMIT:1048576}
  auth-token: ${ARTUS_TOKEN:}
  # Applies only while the token is NOT enforced (Settings → Access → "Require access token", read at startup).
  # Defaults are loopback-only; WSL needs the vEthernet range added to trusted-cidrs, and a reverse
  # proxy's external hostname belongs in allowed-hosts. Docs: docs/plan/phase-17-*.md section B.
  # auth:
  #   trusted-cidrs: ["127.0.0.0/8", "::1/128"]
  #   allowed-hosts: ["localhost", "127.0.0.1", "[::1]"]
  #   allowed-origins: []
  linear-api-key: ${ARTUS_LINEAR_API_KEY:}
  voyage-api-key: ${ARTUS_VOYAGE_API_KEY:}
  # Slack mirror (phase 18). Secrets and the allowlist are env vars only (or application-local.yaml
  # with SPRING_PROFILES_ACTIVE=local). Setup: docs/SLACK.md.
  # allowed-users is a comma-separated list of Slack member IDs; empty = every message and click is ignored.
  slack:
    enabled: ${ARTUS_SLACK_ENABLED:false}
    bot-token: ${ARTUS_SLACK_BOT_TOKEN:}
    app-token: ${ARTUS_SLACK_APP_TOKEN:}
    channel: ${ARTUS_SLACK_CHANNEL:}
    allowed-users: ${ARTUS_SLACK_ALLOWED_USERS:}
    verbose: ${ARTUS_SLACK_VERBOSE:false}
    public-url: ${ARTUS_PUBLIC_URL:}
    # allowlisted users may start review/development sessions by mentioning the bot (see docs/SLACK.md)
    start-enabled: ${ARTUS_SLACK_START_ENABLED:false}
  providers:
    claude:
      command: ["node", "sidecar/dist/index.js"]
    codex:
      command: ["node", "sidecar-codex/dist/index.js"]
