name: artus   # pins the compose project (and so the volume name `artus_pgdata`) independent of the folder name
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      # POSTGRES_* only apply when the pgdata volume is first initialised — a volume
      # created under an older name keeps its old DB/user (the pre-rename volume was `agentic-ui_pgdata`).
      POSTGRES_DB: artus
      POSTGRES_USER: artus
      POSTGRES_PASSWORD: ${ARTUS_DB_PASSWORD:-artus}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artus -d artus"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
